<style>
@font-face{font-family:"Pixelify Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/pixelify-400.woff2) format("woff2")}
@font-face{font-family:"Pixelify Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/pixelify-500.woff2) format("woff2")}
:root{
  --bg:#0d1510;--bg2:#15241a;--line:#2b4630;--frame:#2c4e30;--frame2:#18301d;
  --text:#e3eed6;--muted:#93a88a;--faint:#62775b;
  --acc:#9ad26a;--acc-2:#c4ec9b;--acc-deep:#35602a;--gold:#f0dc5a;
  --sea:#1e3a6c;--sea-hi:#2c5395;--land:#4e8c34;--coast:#8acb5a;--border:#2f5d22;
  --region:#37702a;--out:#46523f;--out-coast:#5e6b57;--out-border:#394335;
  --city:#f0dc5a;--city-edge:#14210e;--heli:#cf5a3e;--heli-edge:#1b120d;--glass:#86c9da;--skid:#34342e;--rotor:#dcdccb;
  --px:"Pixelify Sans",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,var(--bg2),var(--bg) 65%);color:var(--text);font-family:var(--px);font-weight:400;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)} a:hover{color:var(--acc-2)}
button{font-family:var(--px)}
:focus{outline:none} :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.adbar{display:flex;justify-content:center;padding:0 18px 14px}
.adbar[hidden]{display:none}
.bar{display:flex;align-items:center;gap:16px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:500}
.brand small{font-size:12px;color:var(--faint);font-weight:400}
.legend{display:flex;gap:12px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:4px;align-items:center}
kbd{font-family:var(--px);font-size:11px;min-width:18px;height:18px;padding:0 4px;display:inline-grid;place-items:center;border-radius:4px;color:var(--text);box-shadow:inset 0 0 0 1px var(--line);background:var(--frame2)}
.toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toggles .tb,.seg{white-space:nowrap;flex:none}
.tb.jb{text-decoration:none;display:inline-block}
.tb{font-size:12px;color:var(--acc);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.tb:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tb:active{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.tb[aria-pressed="false"]{color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.seg span{padding:4px 7px;color:var(--faint)}
.seg button{font-size:12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 8px;cursor:pointer}
.seg button:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.seg button[aria-pressed="true"]{color:var(--bg);background:var(--acc)}

.cabinet{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 18px 18px;min-height:0}
.stage-wrap{flex:1 1 auto;min-width:0;height:100%;display:grid;place-items:center}
.frame{width:min(100%,1080px,calc((100dvh - var(--ad-h,0px) - 110px) * 1.6));padding:clamp(6px,1.4vw,18px);border-radius:14px;background:linear-gradient(160deg,var(--frame),var(--frame2));box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.5)}
.stage{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size;overflow:hidden;border-radius:4px;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0}

.scr{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;justify-content:safe center;align-items:flex-start;padding:5cqw 6cqw;gap:1.6cqw}
.scr{scrollbar-width:none} .scr::-webkit-scrollbar{display:none}
.scr.side{background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent) 0 40%,color-mix(in srgb,var(--bg) 30%,transparent) 62%,transparent 80%)}
.scr.dim{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.kick{font-size:clamp(10px,1.7cqw,15px);color:var(--acc);text-transform:uppercase;letter-spacing:.12em}
.h{font-size:clamp(16px,4.6cqw,46px);line-height:1.15;color:var(--text);margin:0 0 .4cqw;font-weight:500;flex:none}
.sub{font-size:clamp(11px,1.7cqw,16px);line-height:1.35;color:var(--muted);max-width:40ch;text-wrap:pretty;margin:0}
.hint{font-size:clamp(10px,1.35cqw,13px);color:var(--faint);margin-top:.8cqw}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.logo{font-weight:500;font-size:15cqw;line-height:.86;letter-spacing:.01em;background:linear-gradient(180deg,#e6f7d2 0 24%,#c4ec9b 24% 40%,#9ad26a 40% 54%,#78b84c 54% 68%,#5a9a3a 68% 82%,#3f7a2a 82%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(.5cqw .5cqw 0 #10230c)}
.press{font-size:clamp(12px,2.4cqw,24px);color:var(--text);margin-top:3cqw}

.list{flex:none;display:flex;flex-direction:column;gap:.5cqw;margin:.8cqw 0 0;padding:0;list-style:none;width:min(46cqw,100%)}
.list.two{display:grid;grid-template-columns:1fr 1fr;width:min(52cqw,100%)}
.list.compact{gap:.2cqw}
.list.compact .item{padding:.35cqw 1cqw}
.list.compact .item .lab{font-size:clamp(11px,2.1cqw,20px)}
.item{display:grid;grid-template-columns:1.6cqw minmax(0,1fr) auto;align-items:center;column-gap:1.2cqw;padding:.7cqw 1.2cqw;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--muted)}
.item:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.item:active{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.item.sel{border-color:var(--acc);color:var(--text);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.item .car{color:var(--acc);visibility:hidden;font-size:clamp(11px,2.4cqw,22px)}
.item.sel .car{visibility:visible}
.item .lab{font-size:clamp(12px,2.6cqw,24px);line-height:1.1;font-weight:500}
.item .ds{display:block;font-weight:400;font-size:clamp(9px,1.35cqw,13px);color:var(--faint);margin-top:.2cqw}
.item.sel .ds{color:var(--muted)}
.item.locked{opacity:.45;cursor:not-allowed}
.item .num{color:var(--acc);margin-right:1cqw}
.stars{display:inline-flex;gap:.4cqw}
.star{width:clamp(8px,1.6cqw,15px);aspect-ratio:1;background:var(--line);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.star.on{background:var(--gold)}
.stars.big .star{width:clamp(16px,4cqw,38px)}
.rules{max-width:44cqw;margin:.6cqw 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.5cqw}
.rules li{text-wrap:pretty;font-size:clamp(11px,1.7cqw,16px);color:var(--muted);display:flex;gap:1cqw;align-items:baseline}
.rules li::before{content:"";width:.8cqw;height:.8cqw;background:var(--acc);flex:none}
.statrow{display:flex;gap:4cqw;margin:1cqw 0}
.stat .v{font-size:clamp(16px,4cqw,40px);color:var(--text);line-height:1}
.stat .k2{font-size:clamp(9px,1.3cqw,12px);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}

.hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:3cqw;padding:1.2cqw 2cqw 2.6cqw;background:linear-gradient(180deg,var(--bg) 55%,transparent)}
.hud .k{font-size:clamp(8px,1.35cqw,12px);color:var(--acc);letter-spacing:.12em;text-transform:uppercase}
.hud .t{font-size:clamp(14px,3.4cqw,32px);color:var(--text);line-height:1.05;font-weight:500}
.hud-stats{display:flex;gap:2.4cqw}
.hud-stats .v{font-size:clamp(11px,2.2cqw,20px);color:var(--text);line-height:1.1}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 2cqw 1.2cqw;display:flex;flex-direction:column;gap:.8cqw}
.hud-row{display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw}
.toast{font-size:clamp(11px,2.2cqw,20px);padding:.5cqw 1.2cqw;border-radius:4px;background:var(--bg);box-shadow:0 0 0 1px var(--acc);color:var(--text);opacity:0;transform:translateY(.6cqw);transition:opacity .15s,transform .15s}
.toast.on{opacity:1;transform:none}
.toast.bad{box-shadow:0 0 0 1px var(--muted);color:var(--muted)}
#mini{width:17cqw;aspect-ratio:1.6;image-rendering:pixelated;border-radius:3px;box-shadow:0 0 0 1px var(--acc-deep),0 0 0 3px var(--bg);background:var(--sea)}
.timebar{width:100%;height:clamp(4px,1cqw,10px);display:grid;grid-template-columns:repeat(20,1fr);gap:clamp(1px,.3cqw,3px)}
.timebar i{display:block;height:100%;background:var(--frame2);border-radius:1px}
.timebar i.on{background:var(--acc)}
.timebar.low i.on{background:var(--gold)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:18cqw;color:var(--acc-2);text-shadow:.6cqw .6cqw 0 #10230c;font-weight:500}
.lbl{position:absolute;transform:translate(-50%,-190%);font-size:clamp(9px,1.6cqw,15px);padding:.2cqw .8cqw;background:var(--bg);color:var(--gold);border-radius:3px;white-space:nowrap;display:none}

.pad{display:none;flex:none;gap:12px;align-items:center}
body.touch .pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pb{font-size:18px;color:var(--acc);background:var(--frame2);border:1px solid var(--line);border-radius:8px;touch-action:none;display:grid;place-items:center;cursor:pointer}
.pb:active,.pb.on{background:var(--acc-deep);border-color:var(--acc);color:var(--text)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.fire{width:96px;height:96px;border-radius:50%;border-color:var(--acc);font-size:20px;color:var(--text)}
.pad-r{flex-direction:column}
.pad-r .mini{width:96px;height:36px;font-size:13px}
.pads{display:contents}
@media (orientation:portrait){
  body.touch .cabinet{flex-direction:column;justify-content:flex-start;padding:8px}
  body.touch .stage-wrap{height:auto;width:100%;flex:none}
  body.touch .frame{width:100%}
  body.touch .pads{display:grid;width:100%;grid-template-columns:1fr auto;grid-template-areas:"s s" "l r";align-items:center;row-gap:16px;padding:0 12px 16px}
  body.touch .stage-wrap{grid-area:s}
  body.touch .pad-l{grid-area:l}
  body.touch .pad-r{grid-area:r}
  body.touch .legend{display:none}
}
@media (max-width:760px){.legend{display:none}}
@media (max-width:480px){.brand small,.tb .pre{display:none}}
@media (orientation:landscape) and (max-height:520px){
  .bar{padding:4px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));gap:10px}
  .brand small,.legend{display:none}
  .cabinet{padding:4px max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px}
  .frame{width:min(100%,calc((100dvh - 52px) * 1.6));padding:5px}
}

/* ---------- MAP (pixel-block rendering) ---------- */
let feats, byName, meshAll;
function makeView(scope, id){
  if (scope==='world') return {id:'world', scope, name:'World', members:new Set(feats.map(f=>f.properties.name).filter(n=>!['Antarctica','Fr. S. Antarctic Lands'].includes(n)))};
  if (scope==='continent'){ const c = CONTINENTS.find(c=>c.id===id); return {id:c.id, scope, name:c.name, bbox:c.bbox, members:new Set(c.list)}; }
  const c = COUNTRIES.find(c=>c.id===id); if (!c.bbox) c.bbox = autoBBox(c);
  return {id:'c-'+c.id, scope, name:c.name, bbox:c.bbox, members:new Set([c.feat]), cities:c.cities, regions:REGD[c.id], cont:c.cont};
}
function autoBBox(c){
  const f = byName.get(c.feat); let b = [[180,90],[-180,-90]];
  if (f){ const polys = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates; let best=null, ba=-1; for (const p of polys){ const a=d3.geoArea({type:'Polygon',coordinates:p}); if (a<6 && a>ba){ ba=a; best=p; } } if (best) b = d3.geoBounds({type:'Polygon',coordinates:best}); }
  for (const [,x,y] of c.cities){ b[0][0]=Math.min(b[0][0],x); b[0][1]=Math.min(b[0][1],y); b[1][0]=Math.max(b[1][0],x); b[1][1]=Math.max(b[1][1],y); }
  const px=(b[1][0]-b[0][0])*.04, py=(b[1][1]-b[0][1])*.04;
  return [b[0][0]-px, b[0][1]-py, b[1][0]+px, b[1][1]+py];
}
function makeProj(view, ext){
  if (view.scope==='world') return d3.geoNaturalEarth1().fitExtent(ext, {type:'FeatureCollection', features:feats.filter(f=>f.properties.name!=='Antarctica')});
  const [x0,y0,x1,y1] = view.bbox;
  return d3.geoMercator().fitExtent(ext, {type:'MultiPoint', coordinates:[[x0,y0],[x1,y1]]});
}
const REGD = {}, REGP = {};
function loadRegions(id){ return REGP[id] || (REGP[id] = fetch(`data/regions-${id}.json`).then(r=>r.json()).then(d=>REGD[id]=d).catch(()=>null)); }
const mapCache = new Map();
function getMap(view, borders, mode){
  const Z = mode==='game' ? ZOOM : 1, MW = W*Z, MH = H*Z;
  const key = [view.id, borders, mode, Z, !!view.regions].join('|'); if (mapCache.has(key)) return mapCache.get(key);
  const ext = mode==='game' ? [[70,70],[MW-70,MH-60]] : mode==='preview' ? [[W*.47,16],[W-8,H-8]] : [[4,8],[W-4,H-4]];
  const proj = makeProj(view, ext);
  const w = Math.ceil(MW/BLK), h = Math.ceil(MH/BLK);
  const isMem = f => view.members.has(f.properties.name) || view.members.has(ALIAS[f.properties.name]);
  const layer = fn => { const c=mk(w,h), x=c.getContext('2d'); x.scale(1/BLK,1/BLK); fn(d3.geoPath(proj,x), x); return x.getImageData(0,0,w,h).data; };
  const A = layer((p,x)=>{ x.beginPath(); for (const f of feats) if (isMem(f)) p(f); x.fill(); });
  const B = layer((p,x)=>{ x.beginPath(); for (const f of feats) if (!isMem(f)) p(f); x.fill(); });
  const D = borders ? layer((p,x)=>{ x.beginPath(); p(meshAll); x.lineWidth=BLK; x.stroke(); }) : null;
  const R = borders && view.regions ? layer((p,x)=>{ x.beginPath(); p(view.regions); x.lineWidth=BLK; x.stroke(); }) : null;
  const T = new Uint8Array(w*h);
  for (let i=0;i<T.length;i++) T[i] = A[i*4+3]>127 ? 1 : B[i*4+3]>127 ? 2 : 0;
  const P = {sea:rgb(C.sea), hi:rgb(C.seaHi), land:rgb(C.land), coast:rgb(C.coast), border:rgb(C.border), region:rgb(C.region), out:rgb(C.out), oc:rgb(C.outCoast), ob:rgb(C.outBorder)};
  const c = mk(w,h), x = c.getContext('2d'), im = x.createImageData(w,h), o = im.data;
  for (let y=0;y<h;y++) for (let xx=0;xx<w;xx++){
    const i=y*w+xx, t=T[i]; let col;
    if (t===0) col=P.sea;
    else {
      const coast = (xx>0&&T[i-1]===0)||(xx<w-1&&T[i+1]===0)||(y>0&&T[i-w]===0)||(y<h-1&&T[i+w]===0);
      const bd = D && D[i*4+3]>100;
      let rg = false;
      if (t===1 && R && !coast && !bd && R[i*4+3]>100){ rg = true; for (let dy=-2;dy<=2&&rg;dy++) for (let dx=-2;dx<=2;dx++){ const yy=y+dy, x2=xx+dx; if (yy<0||yy>=h||x2<0||x2>=w||T[yy*w+x2]===0){ rg=false; break; } } }
      col = t===1 ? (coast?P.coast:bd?P.border:rg?P.region:P.land) : (coast?P.oc:bd?P.ob:P.out);
    }
    o[i*4]=col[0]; o[i*4+1]=col[1]; o[i*4+2]=col[2]; o[i*4+3]=255;
  }
  const put = (xx,y) => { const i=(y*w+xx)*4; o[i]=P.hi[0]; o[i+1]=P.hi[1]; o[i+2]=P.hi[2]; };
  for (let y=6; y<h-3; y+=9) for (let xx=((y/9|0)%2)*8+3; xx<w-6; xx+=16){
    let ok=true; for (let dy=-2;dy<=2&&ok;dy++) for (let dx=-2;dx<=6;dx++){ const yy=y+dy, x2=xx+dx; if (yy<0||yy>=h||x2<0||x2>=w||T[yy*w+x2]){ ok=false; break; } }
    if (ok){ put(xx,y); put(xx+1,y-1); put(xx+2,y-1); put(xx+3,y); }
  }
  x.putImageData(im,0,0);
  const m = {canvas:c, proj, MW, MH}; mapCache.set(key, m); return m;
}

function renderMenu({kick, title, sub, items, hint, cls='side', two=false, compact=false, extra=''}){
  const keep = menu && menu._keep;
  menu = {items, i: keep != null ? keep : Math.max(0, items.findIndex(it=>!it.locked))};
  ui.innerHTML = `<div class="scr ${cls}">
    ${kick?`<div class="kick">${kick}</div>`:''}
    <h2 class="h">${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}${extra}
    <ul class="list ${two?'two':''} ${compact?'compact':''}">${items.map((it,i)=>`<li class="item ${it.locked?'locked':''}" data-i="${i}"><span class="car">▸</span><span class="lab">${it.label}${it.ds?`<span class="ds">${it.ds}</span>`:''}</span><span>${it.right||''}</span></li>`).join('')}</ul>
    <div class="hint">${hint || '↑ ↓ or W Z to choose · Space / Enter to confirm · Esc back'}</div></div>`;
  selMenu(menu.i, true);
}
function selMenu(i, silent){
  if (!menu) return; const n=menu.items.length; i=(i+n)%n; menu.i=i;
  ui.querySelectorAll('.item').forEach((el,k)=>el.classList.toggle('sel', k===i));
  if (!silent) Snd.blip();
  menu.items[i].onSel && menu.items[i].onSel();
}
function confirmMenu(){ const it = menu.items[menu.i]; if (it.locked) { Snd.wrong(); return; } Snd.ok(); it.go(); }

}

  const cS = CONTINENTS.reduce((a,c)=>a+sum(c.id),0), kS = COUNTRIES.reduce((a,c)=>a+sum('c-'+c.id),0);

    {label:'A COUNTRY', ds:`${COUNTRIES.length} countries on six continents · their cities`, right:`<span class="ds">${kS}/${COUNTRIES.length*15} ★</span>`, onSel:()=>bgMap=getMap(makeView('country','nl'),true,'preview'), go:()=>goRegions('country')},

    {label:'THE WORLD', ds:'Capitals of every country', right:`<span class="ds">${sum('world')}/15 ★</span>`, onSel:()=>bgMap=getMap(w,true,'preview'), go:()=>{scope='world'; view=w; goLevels();}},
  ], hint:'↑ ↓ or W Z to choose · Space / Enter to confirm'});
}
function goRegions(sc, keep, cont){
  scope=sc;
  if (sc==='country' && !cont){
    state='ccont';
    const items = CONTINENTS.filter(k=>COUNTRIES.some(c=>c.cont===k.id)).map(k=>{ const cs=COUNTRIES.filter(c=>c.cont===k.id); const v={id:'cc-'+k.id, scope:'continent', name:k.name, bbox:k.bbox, members:new Set(cs.map(c=>c.feat))};
      return {label:k.name.toUpperCase(), ds:`${cs.length} ${cs.length>1?'countries':'country'}`, onSel:()=>bgMap=getMap(v,true,'preview'), go:()=>goRegions('country', null, k.id)}; });
    menu = {_keep: keep ?? null};
    renderMenu({kick:'Country mode', title:'PICK A CONTINENT', items});
    return;
  }
  state='region'; scope=sc; const list = sc==='continent' ? CONTINENTS : COUNTRIES.filter(c=>c.cont===cont);
  regionCont = cont;
  const items = list.map(c => { const v=makeView(sc, c.id); const p=pv(v.id); const it = {label:c.name.toUpperCase(), right:stars(Math.round(p.stars.reduce((a,b)=>a+b,0)/5)), onSel:()=>{ if (sc==='country' && !v.regions) loadRegions(c.id).then(d=>{ v.regions=d; if (state==='region' && menu && menu.items[menu.i]===it) bgMap=getMap(v,true,'preview'); }); bgMap=getMap(v,true,'preview'); }, go:()=>{ view=v; goLevels(); }}; return it; });
  menu = {_keep: keep ?? null};
  renderMenu({kick: sc==='continent'?'Pick a continent':`${CONTINENTS.find(k=>k.id===cont).name} · pick a country`, title: sc==='continent'?'CONTINENTS':'COUNTRIES', items, two: true, compact: items.length>10});
}
let regionCont = null;
function goLevels(keep){
  state='level'; const id=view.id, p=pv(id);
  const items = LEVELS.map((L,i)=>({label:`<span class="num">${i+1}</span>${L.name}`, ds: unlocked(id,i)?L.desc.replace('{c}',noun()):'Earn a star on level '+i+' to unlock', locked:!unlocked(id,i), right: stars(p.stars[i]), onSel:()=>bgMap=getMap(view,L.borders,'preview'), go:()=>{ lvl=i; goBrief(); }}));
  menu = {_keep: keep ?? null};
  renderMenu({kick:view.name, title:'CHOOSE A LEVEL', items});
  if (keep==null){ let last=0; items.forEach((it,i)=>{ if(!it.locked) last=i; }); selMenu(last, true); }
}
function menuBack(){
  Snd.back();
  if (state==='scope') goTitle();

const areaOf = n => { const f=byName.get(n); return f ? d3.geoArea(f) : 0; };

  pts.forEach(p=>p.px=m.proj([p.lon,p.lat]));

/* ---------- HELICOPTER (top-down, 32 headings) ---------- */
const HELI = [
"......kkk......",
".....kgggk.....",
"....kgggggk....",
"..s.kgggggk.s..",
"..s.kbgggbk.s..",
"..s.kbbbbbk.s..",
"..skbbbbbbbks..",
"..skbbbbbbbks..",
"..s.kbbbbbk.s..",
"..s.kbbbbbk.s..",
"..s..kbbbk..s..",
"......kbk......",
"......kbk......",
"......kbk......",
"......kbk......",
"......kbk......",
"......kbk......",
"....kkkbkkk....",
"....kbbbbbk....",
"....kkkbkkk....",
"......kbk......",
".......k.......",
];
const HPAL = {k:C.heliEdge, b:C.heli, g:C.glass, s:C.skid};
const HF = [], HS = [], HN = 32, HSZ = 31, HC = 15;
(function buildHeli(){
  for (let n=0;n<HN;n++){
    const a=n/HN*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
    const c=mk(HSZ,HSZ), x=c.getContext('2d'), s=mk(HSZ,HSZ), y=s.getContext('2d'); y.fillStyle=C.heliEdge;
    for (let dy=0;dy<HSZ;dy++) for (let dx=0;dx<HSZ;dx++){
      const rx=dx-HC, ry=dy-HC, sx=Math.round(rx*ca+ry*sa+7), sy=Math.round(-rx*sa+ry*ca+7);
      const ch = HELI[sy] && HELI[sy][sx];
      if (ch && ch!=='.'){ x.fillStyle=HPAL[ch]; x.fillRect(dx,dy,1,1); y.fillRect(dx,dy,1,1); }
    }
    HF.push(c); HS.push(s);
  }
})();
function drawHeli(sx, sy, hd, t){
  const n = ((Math.round(hd/(Math.PI*2)*HN)%HN)+HN)%HN; sx=Math.round(sx); sy=Math.round(sy);
  ctx.globalAlpha=.35; ctx.drawImage(HS[n], sx-HC+6, sy-HC+7); ctx.globalAlpha=1;
  ctx.drawImage(HF[n], sx-HC, sy-HC);
  const ra=t*23; ctx.fillStyle=C.rotor;
  for (let b=0;b<2;b++){ const a=ra+b*Math.PI/2, ca=Math.cos(a), sa=Math.sin(a); for (let r=-12;r<=12;r++){ if (Math.abs(r)<2) continue; ctx.fillRect(Math.round(sx+ca*r), Math.round(sy+sa*r), 1, 1); } }
  ctx.fillStyle=C.heliEdge; ctx.fillRect(sx-1,sy-1,2,2);
}
function turnTo(target, dt){
  let d = target-heli.hd; d = Math.atan2(Math.sin(d), Math.cos(d));
  heli.hd += Math.sign(d)*Math.min(Math.abs(d), dt*7);
}

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000; update(dt,t); draw(t); requestAnimationFrame(loop); }
function update(dt, t){
  const inGame = game && ['count','play','reveal'].includes(state);
  if (!inGame){
    if (['title','scope','ccont','region','level','brief','over'].includes(state)){
      const full = state==='title', cx = full?W*.62:W*.73, ax = full?W*.3:W*.19;
      const nx = cx+Math.sin(t*.35)*ax, ny = H*.55+Math.sin(t*.6)*H*.22;
      const dx=nx-heli.ax, dy=ny-heli.ay; if (heli.ax!=null && Math.hypot(dx,dy)>.01) turnTo(Math.atan2(dx,-dy), dt);
      heli.ax=nx; heli.ay=ny;
    }
    if (state!=='pause') Snd.rotor(0, 10);
    return;
  }
  const L=game.L, tg=game.target;
  if (state==='count'){
    game.cd -= dt; const c=Math.ceil(game.cd);
    if (c!==game.lastCd){ game.lastCd=c; game.el('hC').textContent = c>0?c:'GO!'; Snd.beep(c<=0); }
    if (game.cd <= -.5){ game.el('hC').textContent=''; state='play'; }
    Snd.rotor(.07, 12);
  }
  if (state==='play'){
    const ix=keys.right-keys.left, iy=keys.down-keys.up, k=Math.min(1,dt*4);
    heli.vx += (ix*MAXV-heli.vx)*k; heli.vy += (iy*MAXV-heli.vy)*k;
    const mvx = heli.vx+game.wind.x, mvy = heli.vy+game.wind.y;
    heli.x = Math.max(12, Math.min(game.m.MW-12, heli.x+mvx*dt)); heli.y = Math.max(12, Math.min(game.m.MH-12, heli.y+mvy*dt));
    if (Math.hypot(heli.vx,heli.vy)>12) turnTo(Math.atan2(heli.vx,-heli.vy), dt);
    follow();
    game.tLeft -= dt;
    const s=Math.ceil(game.tLeft); if (game.tLeft<5 && s!==game.lastTick){ game.lastTick=s; Snd.tick(); }
    if (Math.hypot(tg.px[0]-heli.x, tg.px[1]-heli.y) <= HIT_R) { hitTarget(); }
    else if (game.tLeft<=0){ state='reveal'; game.st=null; toast(`TIME UP! HERE IS ${tg.name.toUpperCase()}`, true); Snd.timeout(); }
    else if (L.dots){
      let near=null; for (const p of game.pool) if (p!==tg && Math.hypot(p.px[0]-heli.x,p.px[1]-heli.y) <= HIT_R) { near=p; break; }
      if (near!==game.hover){ game.hover=near; if (near) Snd.pass(); }
    }

      else { const v=Math.max(220, d/2); const st=Math.min(d, v*dt); heli.x+=dx/d*st; heli.y+=dy/d*st; turnTo(Math.atan2(dx,-dy), dt*2); }

    const lit = Math.max(0, Math.ceil(game.tLeft/game.T*20));

  }
}
function draw(t){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=C.sea; ctx.fillRect(0,0,W,H);
  const inGame = game && ['count','play','reveal','pause'].includes(state);
  if (!inGame){
    if (bgMap) ctx.drawImage(bgMap.canvas, 0, 0, W, H);
    if (state!=='boot' && heli.ax!=null) drawHeli(heli.ax, heli.ay, heli.hd, t);
    return;
  }
  const m=game.m, L=game.L, tg=game.target;
  const cx = Math.round(cam.x/BLK)*BLK, cy = Math.round(cam.y/BLK)*BLK;
  ctx.drawImage(m.canvas, cx/BLK, cy/BLK, W/BLK, H/BLK, 0, 0, W, H);
  const dot = (p, col) => { const x=Math.round((p.px[0]-cx)/2)*2, y=Math.round((p.px[1]-cy)/2)*2; if (x<-6||y<-6||x>W+6||y>H+6) return; ctx.fillStyle=C.cityEdge; ctx.fillRect(x-3,y-3,6,6); ctx.fillStyle=col; ctx.fillRect(x-2,y-2,4,4); };
  if (L.dots) for (const p of game.pool) dot(p, C.city);
  if (state==='reveal') { dot(tg, C.gold); const x=Math.round(tg.px[0]-cx), y=Math.round(tg.px[1]-cy); ctx.fillStyle=C.gold; [[-8,-8],[5,-8],[-8,5],[5,5]].forEach(([a,b])=>{ ctx.fillRect(x+a,y+b,3,1); ctx.fillRect(x+a+(a<0?0:2),y+b+(b<0?0:-2),1,3); }); }
  if (L.arrow && state==='play') drawArrow(tg.px[0]-cx, tg.px[1]-cy);
  drawHeli(heli.x-cx, heli.y-cy, heli.hd, t);
  const lbl = game.el('hL'); const lp = state==='reveal' ? tg : (state==='play' ? game.hover : null);
  if (lbl){ if (lp){ lbl.style.display='block'; lbl.textContent=lp.name.toUpperCase(); lbl.style.left=((lp.px[0]-cx)/W*100)+'%'; lbl.style.top=((lp.px[1]-cy)/H*100)+'%'; } else lbl.style.display='none'; }
  const g=game.mctx; if (g){ g.drawImage(game.miniBase,0,0); const s=120/m.MW; g.strokeStyle=C.acc; g.lineWidth=1; g.strokeRect(Math.round(cx*s)+.5, Math.round(cy*s)+.5, Math.round(W*s), Math.round(H*s)); g.fillStyle=C.heli; g.fillRect(Math.round(heli.x*s)-1, Math.round(heli.y*s)-1, 3, 3); }
}
function drawArrow(tx, ty){
  const x0=16, y0=HUDTOP+14, x1=W-16, y1=H-20;
  if (tx>x0 && tx<x1 && ty>y0 && ty<y1) return;
  const ox=W/2, oy=(H+HUDTOP)/2, dx=tx-ox, dy=ty-oy;
  const s = Math.min(dx>0?(x1-ox)/dx:dx<0?(x0-ox)/dx:1e9, dy>0?(y1-oy)/dy:dy<0?(y0-oy)/dy:1e9);
  const px=ox+dx*s, py=oy+dy*s, a=Math.atan2(dy,dx), ca=Math.cos(a), sa=Math.sin(a);
  const tri = (r, col) => { ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(px+ca*7*r, py+sa*7*r); ctx.lineTo(px-ca*5*r-sa*6*r, py-sa*5*r+ca*6*r); ctx.lineTo(px-ca*5*r+sa*6*r, py-sa*5*r-ca*6*r); ctx.closePath(); ctx.fill(); };
  tri(1.35, C.cityEdge); tri(1, C.gold);
}
